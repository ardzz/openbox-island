name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck jq python3 python3-pip inotify-tools
          sudo pip3 install --break-system-packages 'icalendar>=7,<8' 'recurring-ical-events>=3.8,<4'
          git clone --depth 1 --branch v1.14.0 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          sudo "$RUNNER_TEMP/bats-core/install.sh" /usr/local

      - name: Lint
        run: tools/check

      - name: Bats tests
        run: bats -r tests/

      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

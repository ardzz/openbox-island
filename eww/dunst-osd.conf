# The island shows notifications and the volume/backlight OSDs instead of dunst popups.
# Rules apply in order; later ones override earlier ones.
# Every notification goes to the island's listener and leaves only a history entry.
[island_notify]
skip_display = true
script = ~/.config/eww-island/scripts/notify-hook

# The launcher's own failures stay visible popups.
[island_notify_self]
appname = eww-island
skip_display = false

[island_osd_volume]
stack_tag = "obvolume"
skip_display = true
history_ignore = true

[island_osd_backlight]
stack_tag = "obbacklight"
skip_display = true
history_ignore = true

[general]
bars = 6
framerate = 60
autosens = 1
sensitivity = 100
lower_cutoff_freq = 50
higher_cutoff_freq = 10000
sleep_timer = 0

[input]
method = fifo
source = /dev/stdin
sample_rate = 48000
sample_bits = 16

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 12
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
; Template: viz renders a runtime copy with framerate = display refresh rate and
; noise_reduction rescaled to keep the settle time of 90 at 60 fps.
noise_reduction = 90
monstercat = 0
waves = 0
